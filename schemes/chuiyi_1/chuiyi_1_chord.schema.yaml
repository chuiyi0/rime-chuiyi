# 吹衣方案一：并击实验版（独立方案，不覆盖标准版）
# Derived from user's own chuiyi_1.schema.yaml mapping without changing rules.
schema:
  schema_id: chuiyi_1_chord
  name: 吹衣方案一（并击实验）
  version: "0.1.0-alpha"
  description: "实验性并击输入；兼容原两字母编码；桌面优先测试"
  dependencies: []
  author: "吹衣OVO"

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
  - name: full_shape
    reset: 0
    states: [半角, 全角]

engine:
  processors:
    - ascii_composer
    - recognizer
    - chord_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

menu:
  page_size: 5

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  initials: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
