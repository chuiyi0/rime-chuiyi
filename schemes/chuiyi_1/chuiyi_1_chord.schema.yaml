translator:
  dictionary: chuiyi_1
  prism: chuiyi_1
  user_dict: chuiyi_1
  enable_user_dict: true
  enable_sentence: true

chord_composer:
  # 字母单独输入仍按原编码工作；同时按键时合成为一个两字母编码。
  # 字母按 a-z 排序：按下 x+y 输出 xy；Space+x+y 输出 yx；Space+x 输出 xx。
  alphabet: " abcdefghijklmnopqrstuvwxyz"
  algebra:
    - 'xform/^ ([a-z])$/$1$1/'
    - 'xform/^ ([a-z])([a-z])$/$2$1/'
  prompt_format:
    - 'xform/^(.*)$/[$1]/'

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
