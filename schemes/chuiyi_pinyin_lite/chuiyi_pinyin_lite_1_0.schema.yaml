schema:
  schema_id: chuiyi_pinyin_lite_1_0
  name: 吹衣带调拼音轻量版 1.1.0
  version: "1.1.0"
  description: "基于小鹤双拼布局的自定义带调双拼；第四声使用指定替代键"
  dependencies: []
  author: "吹衣OVO"

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
  - name: full_shape
    reset: 0
    states: [半角, 全角]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

menu:
  page_size: 5

