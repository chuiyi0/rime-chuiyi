name: 生成并发布吹衣带调拼音安装包

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-release.yml'
      - 'schemes/chuiyi_pinyin/**'
      - 'docs/releases/1.1.1.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 生成完整 Rime 安装 ZIP
        run: |
          python schemes/chuiyi_pinyin/tools/build.py
          test -s dist/chuiyi_pinyin-1.1.1.zip
          python - <<'PY'
          import zipfile
          p='dist/chuiyi_pinyin-1.1.1.zip'
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              required={'chuiyi_pinyin_1_1.schema.yaml','chuiyi_pinyin_1_1.dict.yaml'}
              assert required <= names, sorted(required-names)
              assert any(x.startswith('chuiyi_pinyin_1_1_dicts/') for x in names)
              print(f'Package validated: {len(names)} files')
          PY
      - name: 发布可直接安装的 ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1.1 >/dev/null 2>&1; then
            gh release upload v1.1.1 dist/chuiyi_pinyin-1.1.1.zip --clobber
          else
            gh release create v1.1.1 dist/chuiyi_pinyin-1.1.1.zip \
              --target "$GITHUB_SHA" \
              --title "吹衣带调拼音 1.1.1" \
              --notes-file docs/releases/1.1.1.md
          fi
