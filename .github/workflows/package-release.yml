name: 生成并发布吹衣带调拼音安装包

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-release.yml'
      - 'schemes/chuiyi_pinyin/**'
      - 'archive/chuiyi_1/chuiyi_1.schema.yaml'
      - 'archive/chuiyi_1/chuiyi_dicts/**'
      - 'LICENSE'
      - 'NOTICE.md'
      - 'LICENSES/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 生成完整 Rime 安装 ZIP
        run: |
          python schemes/chuiyi_pinyin/tools/build.py
          test -s dist/chuiyi_pinyin-1.0-dev.zip
          python - <<'PY'
          import zipfile
          p='dist/chuiyi_pinyin-1.0-dev.zip'
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              required={
                  'chuiyi_pinyin.schema.yaml', 'chuiyi_pinyin.dict.yaml',
                  'chuiyi_pinyin_dicts/chars.dict.yaml',
                  'chuiyi_pinyin_dicts/base.dict.yaml',
                  'INSTALL.md', 'LICENSE', 'NOTICE.md',
                  'LICENSES/README.md', 'LICENSES/rime-ice-GPL-3.0.txt',
                  'LICENSES/pinyin-data-MIT.txt',
                  'LICENSES/phrase-pinyin-data-MIT.txt',
              }
              assert names == required, sorted(names ^ required)
              print(f'Package validated: {len(names)} files')
          PY
      - name: 发布可直接安装的 ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0-dev >/dev/null 2>&1; then
            gh release upload v1.0.0-dev dist/chuiyi_pinyin-1.0-dev.zip --clobber
          else
            gh release create v1.0.0-dev dist/chuiyi_pinyin-1.0-dev.zip \
              --target "$GITHUB_SHA" \
              --title "吹衣带调拼音 1.0-dev（开发版）" \
              --prerelease \
              --notes "吹衣带调拼音 1.0-dev，内含方案、词库及安装说明。安装步骤见包内 INSTALL.md。"
          fi
